# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: "ma_kien_thuc_khop"
    definition: "Câu luyện được chọn có mã kiến thức (kc_code) khớp đúng với mã sai của học viên không. Kiểm chứng: so sánh cột kc_code trong output với expected_kc_code của input."
    grader: "code"
    threshold: "≥ 100% câu type 'kho' (tất cả câu luyện phải đúng mã)"
    why: "Pain: Học viên thiếu ví dụ khác cùng chủ đề để kiểm tra hiểu lại. Nếu AI chọn sai mã → không giúp được."

  - name: "do_sau_giai_thich"
    definition: "Expected (đáp án chuẩn) có giải thích rõ (tại sao, không chỉ là), ví dụ cụ thể, và (nếu hợp lý) con số hoặc tính toán không. Kiểm chứng: Expected phải có ≥2 trong: (1) lý giải 'tại sao', (2) ví dụ cụ thể, (3) con số/phép tính, (4) so sánh hướng khác."
    grader: "nguoi"
    threshold: "≥ 80% câu thuong"
    why: "Pain: Học viên xem lời giải nhưng vẫn có thể không hiểu (cần ví dụ khác). Đáp án sâu giúp họ hiểu lý do chứ không chỉ nhớ."

  - name: "phu_hop_pass_criterion"
    definition: "Câu trả lời (expected) phải thỏa hết các điều kiện ghi trong pass_criterion của chính câu đó. Kiểm chứng: Người chấm kiểm pass_criterion → kiểm output → khớp hay không."
    grader: "nguoi"
    threshold: "100% câu (nếu không thỏa pass_criterion thì pass=0)"
    why: "Pain: Câu luyện phải thực sự giúp học viên kiểm tra lại chủ đề. Nếu expected chưa thỏa chuẩn chấm → không dùng được."
