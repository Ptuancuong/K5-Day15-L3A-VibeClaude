metrics:
  - name: dung_cau_luyen
    definition: "Trên câu thường và khó, dòng đầu khớp mã expected và câu hiển thị khớp ngân hàng."
    grader: code
    threshold: "≥90% câu thường và khó"
    why: "Học viên cần ví dụ phù hợp để thử lại, xem evidence/data-mining.md."
  - name: tu_choi_dung
    definition: "Trên câu tu_choi, dòng đầu là CHUA_CO và không hiển thị câu luyện."
    grader: code
    threshold: "100% câu tu_choi"
    why: "Tránh cho học viên luyện sai chủ đề."
  - name: yeu_cau_giai_thich
    definition: "Trên câu thường và khó, output đưa một câu luyện từ ngân hàng và yêu cầu giải thích bằng một câu."
    grader: code
    threshold: "≥90% câu thường và khó"
    why: "Lý do giúp người chấm xem học viên vận dụng kiến thức ra sao."
