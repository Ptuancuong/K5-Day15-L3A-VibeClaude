# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản
  low: 77
  base: 124
  high: 700
  source: "Data BTC: 77/436 học viên có làm phần ôn cuối ngày (05–24/11/2026, evidence/data-mining.md); lớp L3 hơn 700 học viên (README hackathon). Thấp = 77, đúng số người đang làm ôn. Cơ sở = 77/436 × 700 ≈ 124 (tự ước tính: giữ tỉ lệ người làm ôn, áp lên lớp L3). Cao = 700 (mọi học viên L3 dùng, tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.40             # 31/77 học viên làm ôn (40,3%): sai ≤2 câu / 20 ngày
    uses_per_month: 1.5     # trung bình 0,97 câu sai / 20 ngày × 30/20; mỗi câu sai = 1 phiên
    turns_per_session: 1
    source: "data BTC answers.csv (77 học viên làm ôn cuối ngày, 05–24/11/2026): 31/77 sai ≤2 câu, trung bình 0,97 câu / 20 ngày → 1,5 / tháng. Cách đếm: evidence/data-mining.md. turns_per_session = 1 (tự ước tính): lát cắt MỘT CÂU, spec §4"
  - name: dung_vua
    share: 0.34             # 26/77 (33,8%): sai 3–6 câu / 20 ngày
    uses_per_month: 6.2     # trung bình 4,12 câu sai / 20 ngày × 30/20
    turns_per_session: 1
    source: "data BTC answers.csv: 26/77 sai 3–6 câu, trung bình 4,12 / 20 ngày → 6,2 / tháng. Cách đếm: evidence/data-mining.md. turns_per_session = 1 (tự ước tính)"
  - name: dung_nhieu
    share: 0.26             # 20/77 (26,0%): sai ≥7 câu / 20 ngày
    uses_per_month: 19.6    # trung bình 13,1 câu sai / 20 ngày × 30/20
    turns_per_session: 1
    source: "data BTC answers.csv: 20/77 sai ≥7 câu, trung bình 13,1 / 20 ngày → 19,6 / tháng. Cách đếm: evidence/data-mining.md. turns_per_session = 1 (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.5-flash-lite
    input: 0.30
    output: 2.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · bảng giá K5, xem 25/11/2026 (tầng Nhỏ, model nhóm đang chạy)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · bảng giá K5, xem 25/11/2026 (tầng Lớn)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
